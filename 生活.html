<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dream Savings</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3fc;color:#302640;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:22px}h1{color:#7952b3;font-size:32px;margin-bottom:4px}h2{font-size:19px}section{background:white;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 4px 20px #7653a510}input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #ddd4eb;width:100%;margin:5px 0}button{background:#7952b3;color:white;border:0;cursor:pointer;font-weight:bold}button.alt{background:#eee7f8;color:#674399}label{font-size:13px;color:#655773;display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.muted,small{color:#766b83}progress{width:100%;accent-color:#7952b3;height:16px}strong{color:#7952b3}canvas{width:100%;height:210px} [hidden]{display:none!important}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}.bar button{width:auto} @media(max-width:380px){main{padding:12px}}</style><main><h1>Dream Savings</h1><p class="muted">夢を、毎日の計画に。</p><section id="login"><h2>はじめまして</h2><label>ユーザー名<input id="name" maxlength="40" placeholder="ユーザー名を入力"></label><button onclick="register()">新規登録して始める</button><button class="alt" onclick="showUsers()">登録済みの方はこちら</button><div id="users" hidden></div><p id="msg" role="status"></p><small>データはこのブラウザ内に保存されます。別端末との同期やパスワード認証はありません。</small></section><div id="app" hidden><div class="bar"><h2 id="welcome"></h2><button class="alt" onclick="logout()">ログアウト</button></div><section><h2>貯金目標を追加</h2><label>目標名<input id="title" placeholder="旅行・留学など"></label><div class="grid"><label>目標金額（円）<input id="amount" type="number" min="1"></label><label>現在の貯金（円）<input id="saved" type="number" min="0" value="0"></label></div><label>支払期限<input id="deadline" type="date"></label><button onclick="addGoal()">目標を追加</button><p id="goalmsg" role="status"></p></section><div id="goals"></div><section><h2>月別収支計画</h2><div class="grid"><label>時給（円）<input id="wage" type="number" min="0"></label><label>1日の勤務時間<input id="hours" type="number" min="0" max="24" step="0.5"></label><label>毎月の生活費（円）<input id="expense" type="number" min="0"></label><label>毎月の勤務日数（基本）<input id="days" type="number" min="0" max="31"></label></div><div id="months"></div><button onclick="savePlan()">計画を保存・再計算</button><small>税・社会保険料は自動計算しません。必要なら生活費に含めてください。今月の計画は残り期間の収支として入力してください。</small></section><section><h2>貯金予測</h2><div id="summary"></div><canvas id="chart" width="660" height="240" aria-label="貯金残高予測グラフ"></canvas><div id="forecast"></div></section><section><h2>買い物シミュレーション</h2><label>購入金額（円）<input id="purchase" type="number" min="0" value="0" oninput="renderForecast()"></label><div id="simulation"></div></section></div></main><script>
const $=id=>document.getElementById(id), yen=n=>Math.round(n).toLocaleString('ja-JP')+'円', num=id=>Math.max(0,Number($(id).value)||0);let db;try{db=JSON.parse(localStorage.getItem('dreamSavingsV1'))||[]}catch{db=[]}let user=null;function persist(){try{localStorage.setItem('dreamSavingsV1',JSON.stringify(db))}catch{alert('保存できませんでした。ブラウザの保存設定を確認してください。')}}function register(){let name=$('name').value.trim();if(!name||db.some(u=>u.name===name)){$('msg').textContent='未登録のユーザー名を入力してください。';return}user={name,goals:[],plan:{wage:1700,hours:8,expense:50000,days:8,months:{}}};db.push(user);persist();enter(user)}function showUsers(){$('users').hidden=false;$('users').replaceChildren();if(!db.length)$('users').textContent='登録済みのユーザーはいません。';db.forEach(u=>{let b=document.createElement('button');b.className='alt';b.textContent=u.name;b.onclick=()=>enter(u);$('users').append(b)})}function enter(u){user=u;$('login').hidden=true;$('app').hidden=false;$('welcome').textContent=u.name+' さん';for(let k of ['wage','hours','expense','days'])$(k).value=u.plan[k];$('purchase').value=0;render()}function logout(){user=null;$('app').hidden=true;$('login').hidden=false;$('users').hidden=true;$('users').replaceChildren();$('name').value='';$('msg').textContent=''}function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function today(){let d=new Date();return key(d)+'-'+String(d.getDate()).padStart(2,'0')}function monthList(){let now=new Date(),last=user.goals.reduce((m,g)=>Math.max(m,new Date(g.deadline+'T00:00:00').getTime()),now.getTime());let a=[];for(let i=0;i<120;i++){let d=new Date(now.getFullYear(),now.getMonth()+i,1);if(i>=12&&d.getTime()>last)break;a.push(key(d))}return a}function addGoal(){let title=$('title').value.trim(),amount=num('amount'),saved=num('saved'),deadline=$('deadline').value;if(!title||!amount||!deadline||deadline<today()||deadline>key(new Date(new Date().getFullYear()+9,new Date().getMonth(),1))+'-28'){$('goalmsg').textContent='目標名・金額・今日から9年以内の期限を入力してください。';return}user.goals.push({title,amount,saved,deadline});persist();$('title').value='';$('amount').value='';$('saved').value=0;$('goalmsg').textContent='';render()}function render(){let root=$('goals');root.replaceChildren();user.goals.forEach((g,i)=>{let s=document.createElement('section'),h=document.createElement('h2');h.textContent=g.title;s.append(h);let p=document.createElement('p');let n=Math.max(1,(+g.deadline.slice(0,4)-new Date().getFullYear())*12+ +g.deadline.slice(5,7)-new Date().getMonth());p.textContent=yen(g.saved)+' / '+yen(g.amount)+' ｜期限 '+g.deadline+' ｜月あたり残り '+yen(Math.max(0,g.amount-g.saved)/n);s.append(p);let pr=document.createElement('progress');pr.max=g.amount;pr.value=Math.min(g.saved,g.amount);s.append(pr);let l=document.createElement('label');l.textContent='現在の貯金額を更新（円）';let inp=document.createElement('input');inp.type='number';inp.min=0;inp.value=g.saved;l.append(inp);s.append(l);let b=document.createElement('button');b.textContent='貯金額を更新';b.onclick=()=>{g.saved=Math.max(0,Number(inp.value)||0);persist();render()};s.append(b);let del=document.createElement('button');del.className='alt';del.textContent='目標を削除';del.onclick=()=>{if(confirm('この目標を削除しますか？')){user.goals.splice(i,1);persist();render()}};s.append(del);root.append(s)});$('months').replaceChildren();monthList().forEach(m=>{let l=document.createElement('label');l.textContent=m+' 勤務日数（空欄なら基本日数）';let inp=document.createElement('input');inp.type='number';inp.min=0;inp.max=31;inp.dataset.month=m;inp.value=user.plan.months[m]??'';l.append(inp);$('months').append(l)});renderForecast()}function savePlan(){for(let k of ['wage','hours','expense','days'])user.plan[k]=num(k);user.plan.hours=Math.min(24,user.plan.hours);user.plan.days=Math.min(31,user.plan.days);document.querySelectorAll('[data-month]').forEach(e=>{if(e.value==='')delete user.plan.months[e.dataset.month];else user.plan.months[e.dataset.month]=Math.min(31,Math.max(0,Number(e.value)||0))});persist();render()}function forecast(cost){let p=user.plan,balance=user.goals.reduce((s,g)=>s+g.saved,0)-cost;return monthList().map(m=>{let income=p.wage*p.hours*(p.months[m]??p.days)-p.expense;let due=user.goals.filter(g=>g.deadline.slice(0,7)===m).reduce((s,g)=>s+g.amount,0);balance+=income-due;return {m,balance,due,income}})}function renderForecast(){if(!user)return;let a=forecast(0),b=forecast(num('purchase')),short=a.find(x=>x.balance<0),shortB=b.find(x=>x.balance<0);$('summary').textContent=short?'資金不足の見込み：'+short.m+'（'+yen(-short.balance)+'不足）':'設定期間内の月末残高はすべて0円以上です。';$('simulation').textContent=shortB?'購入後の最初の資金不足：'+shortB.m+'（'+yen(-shortB.balance)+'不足）':'購入後も設定期間内の月末残高は0円以上です。';$('forecast').replaceChildren();a.forEach(x=>{let p=document.createElement('p');p.textContent=x.m+' ｜月末残高 '+yen(x.balance)+(x.due?' ｜目標支払 '+yen(x.due):'');$('forecast').append(p)});let c=$('chart'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let vals=a.map(x=>x.balance),lo=Math.min(0,...vals),hi=Math.max(1,...vals),X=i=>45+i*(w-65)/Math.max(1,a.length-1),Y=v=>20+(hi-v)/(hi-lo)*(h-55);ctx.strokeStyle='#ccc';ctx.beginPath();ctx.moveTo(45,Y(0));ctx.lineTo(w-20,Y(0));ctx.stroke();ctx.strokeStyle='#7952b3';ctx.lineWidth=3;ctx.beginPath();vals.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.stroke();ctx.fillStyle='#655773';ctx.font='12px sans-serif';ctx.fillText(a[0].m,45,h-8);ctx.fillText(a.at(-1).m,w-75,h-8);ctx.fillText('0',15,Y(0));} </script></html>
