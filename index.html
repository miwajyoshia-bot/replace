<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dream Savings</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3fc;color:#302640;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:22px}h1{color:#7952b3;font-size:32px;margin-bottom:4px}h2{font-size:19px}section{background:white;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 4px 20px #7653a510}input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #ddd4eb;width:100%;margin:5px 0}button{background:#7952b3;color:white;border:0;cursor:pointer;font-weight:bold}button.alt{background:#eee7f8;color:#674399}label{font-size:13px;color:#655773;display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.muted,small{color:#766b83}progress{width:100%;accent-color:#7952b3;height:16px}strong{color:#7952b3}canvas{width:100%;height:210px} [hidden]{display:none!important}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}.bar button{width:auto} @media(max-width:380px){main{padding:12px}}.month{border:1px solid #ddd4eb;border-radius:14px;padding:12px;margin:12px 0}.shift{background:#f6f3fc;border-radius:10px;padding:10px;margin:8px 0}.shiftgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.shiftgrid input{padding:8px}.month summary{cursor:pointer;font-weight:bold}.shift button{padding:6px;font-size:13px}
:root{color-scheme:light;--ink:#51435f;--purple:#8060b0;--pink:#fbe4ed;--line:#e9e0f2}body{background:radial-gradient(ellipse at 10% 0%,#fce5ef 0,transparent 38%),radial-gradient(ellipse at 95% 15%,#e6dcfa 0,transparent 42%),#faf7fc;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.65}main{max-width:760px;padding:28px 20px 48px}main>h1{position:relative;text-align:center;font-family:Georgia,serif;font-size:clamp(36px,7vw,52px);letter-spacing:-1.8px;color:#7957a3;margin:12px 0 0;line-height:1.15}main>h1:before{content:none;display:block;font:22px system-ui;letter-spacing:9px;color:#b28bc9;margin-bottom:12px}main>p.muted{text-align:center;letter-spacing:2px;font-size:13px;margin:10px 0 28px}section{border:1px solid #fff;background:#ffffffed;border-radius:26px;padding:24px;margin:18px 0;box-shadow:0 8px 30px #8060b012,0 2px 6px #8060b008}h2{font-size:19px;color:#624783;letter-spacing:.4px;margin:0 0 18px}section h2:before{content:none;color:#c49bd6;margin-right:9px}#login{max-width:470px;margin:24px auto;padding:30px}#login:before{content:none;display:grid;place-items:center;width:76px;height:76px;margin:0 auto 18px;background:linear-gradient(145deg,#fce2ec,#e7dcfa);border:5px solid #fff;box-shadow:0 4px 18px #a887c42b;border-radius:28px;color:#9872bd;font-size:44px;line-height:1}#login h2{text-align:center;font-size:23px}#login h2:before{content:none}input,select{background:#fcfaff;border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:12px 14px;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}input:focus,select:focus{border-color:#b59ad7;box-shadow:0 0 0 3px #e9ddfa}input::placeholder{color:#a69ab1}button{border-radius:15px;padding:13px 15px;background:linear-gradient(110deg,#9b7ac8,#8060b0);box-shadow:0 4px 10px #9872bd25;transition:filter .15s,transform .15s}button:hover{filter:brightness(1.05)}button:active{transform:scale(.98)}button:focus-visible{outline:3px solid #b89bd8;outline-offset:2px}button.alt{background:#f0e8fa;color:#73569a;box-shadow:none}label{font-weight:600;font-size:12px;letter-spacing:.2px}small,.muted{color:#82738e}small{font-size:12px}#login small{display:block;margin-top:16px;text-align:center}#users{border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}#msg:empty,#goalmsg:empty,#planmsg:empty{display:none}[role=status]:not(:empty){color:#865c94;background:#fbecf3;padding:10px;border-radius:12px;font-size:13px}.bar{background:#fff9;border:1px solid white;padding:12px 16px;border-radius:20px}.bar h2{margin:0}.bar button{font-size:12px;white-space:nowrap}#goals section{background:linear-gradient(145deg,#fff,#fcf5ff);border:1px solid #eadff6}#goals section>p{font-size:14px;font-weight:600;color:#7957a3}progress{appearance:none;border:0;border-radius:99px;overflow:hidden;height:13px;background:#eee5f7;margin:6px 0 18px}progress::-webkit-progress-bar{background:#eee5f7;border-radius:99px}progress::-webkit-progress-value{background:linear-gradient(90deg,#e8a9c6,#a58bd4);border-radius:99px}progress::-moz-progress-bar{background:linear-gradient(90deg,#e8a9c6,#a58bd4);border-radius:99px}.month{background:#fcfaff;border:1px solid #e9e0f2;border-radius:18px;padding:15px}.month[open]{background:#faf6ff;border-color:#d9c8ef}.month summary{font-size:14px;color:#715293}.month>p{background:#eee6f8;border-radius:12px;padding:10px;font-size:13px;font-weight:600;margin-bottom:0}.shift{background:white;border:1px solid #eee6f5;border-radius:15px;padding:12px}.shift small{display:block;color:#7957a3;font-weight:bold;margin:5px 0}.shift button.alt{background:#fbeaf0;color:#925c76}#summary,#simulation{background:linear-gradient(110deg,#eee6fa,#fbeaf1);padding:16px;border-radius:16px;font-weight:600;font-size:14px}canvas{height:auto;aspect-ratio:660/240;margin:16px 0}#forecast p{padding:12px 10px;margin:5px 0;background:#faf6fd;border-radius:12px;font-size:13px;font-variant-numeric:tabular-nums}#forecast p:nth-child(even){background:#fdf3f7}#storageWarning{background:#fff1db;padding:14px;border-radius:12px}main:after{content:'DREAM SAVINGS  —  LITTLE STEPS, BIG DREAMS';display:block;text-align:center;color:#a08ab5;font-size:10px;letter-spacing:1.5px;margin-top:32px}@media(max-width:480px){main{padding:20px 13px 36px}section{padding:18px;border-radius:22px}#login{padding:24px 20px}.grid{gap:9px}.shiftgrid{gap:5px}.shiftgrid input{padding:8px 5px}.shiftgrid label{font-size:11px}.month{padding:12px}.bar h2{font-size:16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><main><h1>Dream Savings</h1><p class="muted">夢を、毎日の計画に。</p><section id="login"><h2>はじめまして</h2><label>ユーザー名<input id="name" maxlength="40" placeholder="ユーザー名を入力"></label><button type="button" id="registerBtn">新規登録して始める</button><button type="button" class="alt" id="usersBtn">登録済みの方はこちら</button><div id="users" hidden></div><p id="msg" role="status"></p><small>データはこのブラウザ内に保存されます。別端末との同期やパスワード認証はありません。</small></section><p id="storageWarning" hidden role="alert">このブラウザでは保存できません。通常のSafariまたはChromeで開いてください。</p><noscript>このプレビューではJavaScriptが無効です。公開したウェブページをSafariまたはChromeで開いてください。</noscript><div id="app" hidden><div class="bar"><h2 id="welcome"></h2><button class="alt" onclick="logout()">ログアウト</button></div><section><h2>貯金目標を追加</h2><label>目標名<input id="title" placeholder="旅行・留学など"></label><div class="grid"><label>目標金額（円）<input id="amount" type="number" min="1"></label><label>現在の貯金（円）<input id="saved" type="number" min="0" value="0"></label></div><label>支払期限<input id="deadline" type="date"></label><button onclick="addGoal()">目標を追加</button><p id="goalmsg" role="status"></p></section><div id="goals"></div><section><h2>月別収支計画</h2><div class="grid"><label>時給（円）<input id="wage" type="number" min="0"></label><label>1日の勤務時間<input id="hours" type="number" min="0" max="24" step="0.5"></label><label>毎月の生活費（円）<input id="expense" type="number" min="0"></label><label>毎月の勤務日数（基本）<input id="days" type="number" min="0" max="31"></label></div><p class="muted">月ごとに時給・勤務時間・勤務日数を設定できます。空欄は基本設定を使用します。</p><div id="months"></div><p id="planmsg" role="status"></p><button onclick="savePlan()">計画を保存・再計算</button><small>税・社会保険料は自動計算しません。必要なら生活費に含めてください。今月の計画は残り期間の収支として入力してください。</small></section><section><h2>貯金予測</h2><div id="summary"></div><canvas id="chart" width="660" height="240" aria-label="貯金残高予測グラフ"></canvas><div id="forecast"></div></section><section><h2>買い物シミュレーション</h2><label>購入金額（円）<input id="purchase" type="number" min="0" value="0" oninput="renderForecast()"></label><div id="simulation"></div></section></div></main><script>
const $=id=>document.getElementById(id), yen=n=>Math.round(n).toLocaleString('ja-JP')+'円', num=id=>Math.max(0,Number($(id).value)||0);let db;try{db=JSON.parse(localStorage.getItem('dreamSavingsV1'))||[]}catch{db=[]}if(!Array.isArray(db))db=[];let user=null;function persist(){try{localStorage.setItem('dreamSavingsV1',JSON.stringify(db))}catch{document.getElementById('storageWarning').hidden=false}}function register(){let name=$('name').value.trim();if(!name||db.some(u=>u.name===name)){$('msg').textContent='未登録のユーザー名を入力してください。';return}user={name,goals:[],plan:{wage:1700,hours:8,expense:50000,days:8,months:{}}};db.push(user);persist();enter(user)}function showUsers(){$('users').hidden=false;$('users').replaceChildren();if(!db.length)$('users').textContent='登録済みのユーザーはいません。';db.forEach(u=>{let b=document.createElement('button');b.className='alt';b.textContent=u.name;b.onclick=()=>enter(u);$('users').append(b)})}function enter(u){user=u;$('login').hidden=true;$('app').hidden=false;$('welcome').textContent=u.name+' さん';for(let k of ['wage','hours','expense','days'])$(k).value=u.plan[k];$('purchase').value=0;render()}function logout(){user=null;$('app').hidden=true;$('login').hidden=false;$('users').hidden=true;$('users').replaceChildren();$('name').value='';$('msg').textContent=''}function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function today(){let d=new Date();return key(d)+'-'+String(d.getDate()).padStart(2,'0')}function monthList(){let now=new Date(),last=user.goals.reduce((m,g)=>Math.max(m,new Date(g.deadline+'T00:00:00').getTime()),now.getTime());let a=[];for(let i=0;i<120;i++){let d=new Date(now.getFullYear(),now.getMonth()+i,1);if(i>=12&&d.getTime()>last)break;a.push(key(d))}return a}function addGoal(){let title=$('title').value.trim(),amount=num('amount'),saved=num('saved'),deadline=$('deadline').value;if(!title||!amount||!deadline||deadline<today()||deadline>key(new Date(new Date().getFullYear()+9,new Date().getMonth(),1))+'-28'){$('goalmsg').textContent='目標名・金額・今日から9年以内の期限を入力してください。';return}user.goals.push({title,amount,saved,deadline});persist();$('title').value='';$('amount').value='';$('saved').value=0;$('goalmsg').textContent='';render()}function render(){let root=$('goals');root.replaceChildren();user.goals.forEach((g,i)=>{let s=document.createElement('section'),h=document.createElement('h2');h.textContent=g.title;s.append(h);let p=document.createElement('p');let n=Math.max(1,(+g.deadline.slice(0,4)-new Date().getFullYear())*12+ +g.deadline.slice(5,7)-new Date().getMonth());p.textContent=yen(g.saved)+' / '+yen(g.amount)+' ｜期限 '+g.deadline+' ｜月あたり残り '+yen(Math.max(0,g.amount-g.saved)/n);s.append(p);let pr=document.createElement('progress');pr.max=g.amount;pr.value=Math.min(g.saved,g.amount);s.append(pr);let l=document.createElement('label');l.textContent='現在の貯金額を更新（円）';let inp=document.createElement('input');inp.type='number';inp.min=0;inp.value=g.saved;l.append(inp);s.append(l);let b=document.createElement('button');b.textContent='貯金額を更新';b.onclick=()=>{g.saved=Math.max(0,Number(inp.value)||0);persist();render()};s.append(b);let del=document.createElement('button');del.className='alt';del.textContent='目標を削除';del.onclick=()=>{if(confirm('この目標を削除しますか？')){user.goals.splice(i,1);persist();render()}};s.append(del);root.append(s)});renderMonths();renderForecast()}
function monthRows(m){let p=user.plan,v=p.months[m];return Array.isArray(v)?v:[{wage:null,hours:null,days:v??null}]}
function gross(m){let p=user.plan;return monthRows(m).reduce((sum,r)=>sum+(r.wage??p.wage)*(r.hours??p.hours)*(r.days??p.days),0)}
function renderMonths(){let root=$('months');root.replaceChildren();monthList().forEach(m=>{let box=document.createElement('details');box.className='month';box.dataset.month=m;let heading=document.createElement('summary'),rows=document.createElement('div'),total=document.createElement('p');box.append(heading,rows);function update(){let pay=0,days=0;rows.querySelectorAll('.shift').forEach(r=>{let values=['wage','hours','days'].map(k=>{let e=r.querySelector('[data-field='+k+']');return e.value===''?num(k):Math.max(0,Number(e.value)||0)});pay+=values[0]*values[1]*values[2];days+=values[2];r.querySelector('small').textContent='給料：'+yen(values[0]*values[1]*values[2])});heading.textContent=m+' ｜給料 '+yen(pay);total.textContent='合計 '+days+'日 ｜貯金可能額 '+yen(pay-num('expense'));}function add(v){let row=document.createElement('div');row.className='shift';let grid=document.createElement('div');grid.className='shiftgrid';for(let [k,label,max,step] of [['wage','時給（円）',null,1],['hours','勤務時間',24,0.25],['days','勤務日数',31,1]]){let l=document.createElement('label');l.textContent=label;let e=document.createElement('input');e.type='number';e.min=0;e.step=step;if(max)e.max=max;e.dataset.field=k;e.placeholder='基本';e.value=v[k]??'';e.oninput=update;l.append(e);grid.append(l)}let small=document.createElement('small'),del=document.createElement('button');del.className='alt';del.textContent='この勤務条件を削除';del.onclick=()=>{row.remove();update()};row.append(grid,small,del);rows.append(row);update()}let plus=document.createElement('button');plus.className='alt';plus.textContent='＋ 勤務条件を追加';plus.onclick=()=>add({wage:null,hours:null,days:0});box.append(plus,total);root.append(box);monthRows(m).forEach(add);update();for(let k of ['wage','hours','days','expense'])$(k).addEventListener('input',update,{signal:monthController.signal})})}
let monthController=new AbortController();const originalRenderMonths=renderMonths;renderMonths=function(){monthController.abort();monthController=new AbortController();originalRenderMonths()};
function savePlan(){let months={...user.plan.months};for(let box of document.querySelectorAll('details[data-month]')){let rows=[],days=0;for(let row of box.querySelectorAll('.shift')){let r={};for(let e of row.querySelectorAll('input')){if(!e.checkValidity()){$('planmsg').textContent=box.dataset.month+' の入力値を確認してください。';box.open=true;e.reportValidity();return}r[e.dataset.field]=e.value===''?null:Number(e.value)}days+=r.days??num('days');rows.push(r)}let [y,m]=box.dataset.month.split('-').map(Number);if(days>new Date(y,m,0).getDate()){$('planmsg').textContent=box.dataset.month+' の勤務日数が月の日数を超えています。';box.open=true;return}months[box.dataset.month]=rows}for(let k of ['wage','hours','expense','days']){if(!$(k).checkValidity()){$(k).reportValidity();return}}for(let k of ['wage','hours','expense','days'])user.plan[k]=num(k);user.plan.months=months;persist();render();$('planmsg').textContent='保存しました。'}
function forecast(cost){let p=user.plan,balance=user.goals.reduce((s,g)=>s+g.saved,0)-cost;return monthList().map(m=>{let income=gross(m)-p.expense;let due=user.goals.filter(g=>g.deadline.slice(0,7)===m).reduce((s,g)=>s+g.amount,0);balance+=income-due;return {m,balance,due,income}})}function renderForecast(){if(!user)return;let a=forecast(0),b=forecast(num('purchase')),short=a.find(x=>x.balance<0),shortB=b.find(x=>x.balance<0);$('summary').textContent=short?'資金不足の見込み：'+short.m+'（'+yen(-short.balance)+'不足）':'設定期間内の月末残高はすべて0円以上です。';$('simulation').textContent=shortB?'購入後の最初の資金不足：'+shortB.m+'（'+yen(-shortB.balance)+'不足）':'購入後も設定期間内の月末残高は0円以上です。';$('forecast').replaceChildren();a.forEach(x=>{let p=document.createElement('p');p.textContent=x.m+' ｜給料 '+yen(gross(x.m))+' ｜月末残高 '+yen(x.balance)+(x.due?' ｜目標支払 '+yen(x.due):'');$('forecast').append(p)});let c=$('chart'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let vals=a.map(x=>x.balance),lo=Math.min(0,...vals),hi=Math.max(1,...vals),X=i=>45+i*(w-65)/Math.max(1,a.length-1),Y=v=>20+(hi-v)/(hi-lo)*(h-55);ctx.strokeStyle='#ccc';ctx.beginPath();ctx.moveTo(45,Y(0));ctx.lineTo(w-20,Y(0));ctx.stroke();ctx.strokeStyle='#7952b3';ctx.lineWidth=3;ctx.beginPath();vals.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.stroke();ctx.fillStyle='#655773';ctx.font='12px sans-serif';ctx.fillText(a[0].m,45,h-8);ctx.fillText(a.at(-1).m,w-75,h-8);ctx.fillText('0',15,Y(0));} 
$('registerBtn').addEventListener('click',register);$('usersBtn').addEventListener('click',showUsers);$('name').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();register()}});
</script></html>
